syntax = "proto3";

package user;

option go_package = "./pb";

import "user.proto";

service OrderService {
    rpc GetOrder(GetOrderRequest) returns (Order) {}
}

message Order {
    string id = 1;
    string status = 2;
    double subtotal = 3;
    double tax = 4;
    double grand_total = 5;
    string user_id = 6;
    string created_at = 7;
    string updated_at = 8;
    user.User user = 9;
}

message GetOrderRequest{
    string id = 1;
}